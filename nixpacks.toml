# Nixpacks configuration for Laravel with PHP and Node
providers = ["php", "node"]

[phases.install]
cmds = [
    "composer install --optimize-autoloader --no-scripts --no-interaction --ignore-platform-req=ext-gd",
    "npm install"
]

[phases.build]
cmds = [
    "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan storage:link && php-fpm -D && nginx -g 'daemon off;'"
